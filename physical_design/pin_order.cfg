# Pin Placement Order Configuration for XGPU (`gpu` top-level module)
# Compatible with OpenLane 2 (`FP_PIN_ORDER_CFG`) / OpenROAD IO placer.
#
# Signal pin budget (default parameters = 183 pins total):
#   North (#N): Host control, clock, and reset              (13 pins)
#   West  (#W): Program memory read channel (1 channel)     (26 pins)
#   East  (#E): Data memory read channels (4 channels)      (72 pins)
#   South (#S): Data memory write channels (4 channels)     (72 pins)
#
# Regex patterns match sv2v-flattened Verilog-2005 bus names (e.g., data_mem_read_address[31:0]).

#N
clk
reset
start
done
device_control_write_enable
device_control_data.*

#W
program_mem_read_valid.*
program_mem_read_address.*
program_mem_read_ready.*
program_mem_read_data.*

#E
data_mem_read_valid.*
data_mem_read_address.*
data_mem_read_ready.*
data_mem_read_data.*

#S
data_mem_write_valid.*
data_mem_write_address.*
data_mem_write_data.*
data_mem_write_ready.*
