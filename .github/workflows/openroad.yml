name: XGPU OpenROAD / OpenLane 2 Physical Design

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
    paths:
      - "src/**"
      - "physical_design/**"
      - ".github/workflows/openroad.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "physical_design/**"
      - ".github/workflows/openroad.yml"
  workflow_dispatch:
    inputs:
      run_pnr:
        description: "Run full OpenLane 2 SKY130 Place & Route (GDSII)"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SV2V_VERSION: "v0.0.12"
  OPENLANE_VERSION: "2.2.9"
  PDK_FAMILY: "sky130"
  PDK_VARIANT: "sky130A"
  # Pinned Volare open_pdks commit hash to keep PDK caching deterministic
  VOLARE_PDK_HASH: "bdc9412b3e468c102d01b7cf6337be06ec6e9c9a"

jobs:
  yosys-synthesis:
    name: Yosys RTL Synthesis Check (No PDK Download Required)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Yosys and sv2v
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys unzip curl
          curl -fsSL "https://github.com/zachjs/sv2v/releases/download/${SV2V_VERSION}/sv2v-Linux.zip" -o /tmp/sv2v.zip
          unzip -q /tmp/sv2v.zip -d /tmp/sv2v
          sudo install -m 0755 /tmp/sv2v/sv2v-Linux/sv2v /usr/local/bin/sv2v
          yosys -V
          sv2v --version

      - name: Prepare RTL and run Yosys synthesis
        run: |
          mkdir -p physical_design/reports
          chmod +x physical_design/prepare_rtl.sh
          ./physical_design/prepare_rtl.sh
          yosys -s physical_design/synth.ys 2>&1 | tee physical_design/reports/yosys_synth.log

      - name: Write synthesis summary
        if: always()
        run: |
          {
            echo "### Yosys Generic Synthesis Summary"
            if [ -f physical_design/reports/synth_stat.txt ]; then
              echo '```text'
              tail -n 45 physical_design/reports/synth_stat.txt
              echo '```'
            else
              echo "Synthesis statistics file was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Yosys synthesis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgpu-yosys-synthesis-reports
          path: |
            physical_design/reports/
            physical_design/build/gpu_sv2v.v
          retention-days: 14

  openlane2-sky130:
    name: OpenLane 2 / OpenROAD SKY130 Flow
    runs-on: ubuntu-24.04
    needs: yosys-synthesis
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_pnr }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned sv2v and OpenLane 2 (${{ env.OPENLANE_VERSION }})
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip curl
          curl -fsSL "https://github.com/zachjs/sv2v/releases/download/${SV2V_VERSION}/sv2v-Linux.zip" -o /tmp/sv2v.zip
          unzip -q /tmp/sv2v.zip -d /tmp/sv2v
          sudo install -m 0755 /tmp/sv2v/sv2v-Linux/sv2v /usr/local/bin/sv2v
          python3 -m pip install --upgrade pip
          python3 -m pip install "openlane==${OPENLANE_VERSION}" volare

      - name: Cache SKY130 PDK (avoid re-downloading on every run)
        id: cache-pdk
        uses: actions/cache@v4
        with:
          path: ~/.volare
          key: volare-${{ env.PDK_FAMILY }}-${{ env.VOLARE_PDK_HASH }}

      - name: Enable SKY130 PDK if not cached
        if: steps.cache-pdk.outputs.cache-hit != 'true'
        run: |
          volare enable --pdk "${PDK_FAMILY}" "${VOLARE_PDK_HASH}"

      - name: Verify SKY130 PDK availability before physical design
        id: verify-pdk
        run: |
          LIB_PATH="$HOME/.volare/${PDK_VARIANT}/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib"
          if [[ -f "${LIB_PATH}" ]]; then
            echo "pdk_ready=true" >> "$GITHUB_OUTPUT"
            echo "Verified SKY130 PDK Liberty: ${LIB_PATH}"
          else
            echo "pdk_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SKY130 PDK not found at ${LIB_PATH}; physical-design stages will be skipped."
          fi

      - name: Prepare RTL for OpenLane 2
        if: steps.verify-pdk.outputs.pdk_ready == 'true'
        run: |
          chmod +x physical_design/prepare_rtl.sh
          ./physical_design/prepare_rtl.sh

      - name: Run OpenLane 2 (Yosys + OpenROAD + Magic/Netgen)
        id: run-openlane
        if: steps.verify-pdk.outputs.pdk_ready == 'true'
        run: |
          openlane --dockerized \
            --pdk-root "$HOME/.volare" \
            --pdk "${PDK_VARIANT}" \
            --run-tag ci_run \
            physical_design/config.json

      - name: Check generated GDSII and summarize stage status
        id: check-outputs
        if: always()
        run: |
          GDS_PATH="physical_design/runs/ci_run/final/gds/gpu.gds"
          METRICS_PATH="physical_design/runs/ci_run/final/metrics.json"
          {
            echo "### OpenLane 2 / OpenROAD SKY130 Stage Status"
            echo "- **PDK Verification (${PDK_VARIANT}):** ${{ steps.verify-pdk.outputs.pdk_ready }}"
            if [[ "${{ steps.verify-pdk.outputs.pdk_ready }}" != "true" ]]; then
              echo "- **Physical Design (Synthesis -> Floorplan -> Place -> CTS -> Route -> Signoff -> GDSII):** SKIPPED (PDK unavailable)"
            elif [[ -f "${GDS_PATH}" ]]; then
              echo "- **OpenLane 2 Flow:** COMPLETED"
              echo "- **GDSII Generated:** \`${GDS_PATH}\` ($(du -h "${GDS_PATH}" | cut -f1))"
              echo "gds_generated=true" >> "$GITHUB_OUTPUT"
            else
              echo "- **OpenLane 2 Flow:** FAILED or INCOMPLETE (no final GDSII generated)"
              echo "gds_generated=false" >> "$GITHUB_OUTPUT"
            fi
            if [[ -f "${METRICS_PATH}" ]]; then
              echo "- **Final Metrics:** \`${METRICS_PATH}\` available in uploaded artifacts"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenLane 2 reports and GDSII (only when generated)
        if: steps.check-outputs.outputs.gds_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xgpu-openlane2-sky130-outputs
          path: |
            physical_design/runs/ci_run/final/gds/gpu.gds
            physical_design/runs/ci_run/final/metrics.json
            physical_design/runs/ci_run/final/metrics.csv
            physical_design/runs/ci_run/final/nl/gpu.nl.v
            physical_design/runs/ci_run/reports/
          retention-days: 14
