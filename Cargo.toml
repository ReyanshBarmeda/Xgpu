[package]
name = "xdos"
version = "0.1.0"
edition = "2021"

# Built as a staticlib so the hand-written boot assembly and the linker
# script stay in control of the final image layout.
[lib]
name = "xdos"
path = "src/lib.rs"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
# Keep debug info in the release build; it costs nothing at runtime and
# makes `make debug` with gdb actually usable.
debug = true
